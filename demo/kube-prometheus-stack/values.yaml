customRules: {}
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryCache: true
    k8sContainerMemoryRss: true
    k8sContainerMemorySwap: true
    k8sContainerResource: true
    k8sContainerMemoryWorkingSetBytes: true
    k8sPodOwner: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
  appNamespacesTarget: .*
  additionalRuleGroupLabels: {}
  additionalRuleGroupAnnotations: {}
  runbookUrl: https://runbooks.prometheus-operator.dev/runbooks
  node:
    fsSelector: fstype!=""
  disabled: {}
global:
  rbac:
    create: true
windowsMonitoring:
  enabled: false
alertmanager:
  enabled: false
  extraSecret: {}
grafana:
  enabled: true
  defaultDashboardsEnabled: true
  operator: {}
  defaultDashboardsTimezone: utc
  defaultDashboardsEditable: true
  defaultDashboardsInterval: 1m
  adminPassword: prom-operator
  serviceAccount:
    autoMount: true
  sidecar:
    dashboards:
      enabled: true
      labelValue: '1'
      searchNamespace: ALL
      annotations: {}
      multicluster:
        global: {}
        etcd: {}
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
      name: Prometheus
      uid: prometheus
      httpMethod: POST
      labelValue: '1'
      alertmanager:
        enabled: false
  service:
    portName: http-web
  serviceMonitor:
    enabled: true
    interval: ''
kubernetesServiceMonitors:
  enabled: true
kubeApiServer:
  enabled: true
  tlsConfig:
    serverName: kubernetes
    insecureSkipVerify: false
  serviceMonitor:
    enabled: true
    jobLabel: component
    selector:
      matchLabels:
        component: apiserver
        provider: kubernetes
    metricRelabelings:
      - action: drop
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        sourceLabels:
          - __name__
          - le
kubelet:
  enabled: true
  namespace: kube-system
  serviceMonitor:
    enabled: true
    kubelet: true
    attachMetadata:
      node: false
    honorLabels: true
    honorTimestamps: true
    trackTimestampsStaleness: true
    https: true
    insecureSkipVerify: true
    probes: true
    cAdvisor: true
    cAdvisorInterval: 10s
    cAdvisorMetricRelabelings:
      - sourceLabels:
          - __name__
        action: drop
        regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
      - sourceLabels:
          - __name__
        action: drop
        regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
      - sourceLabels:
          - __name__
        action: drop
        regex: container_memory_(mapped_file|swap)
      - sourceLabels:
          - __name__
        action: drop
        regex: container_(file_descriptors|tasks_state|threads_max)
      - sourceLabels:
          - __name__
          - scope
        action: drop
        regex: container_memory_failures_total;hierarchy
      - sourceLabels:
          - __name__
          - interface
        action: drop
        regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*
      - sourceLabels:
          - __name__
        action: drop
        regex: container_spec.*
      - sourceLabels:
          - id
          - pod
        action: drop
        regex: .+;
    cAdvisorRelabelings:
      - action: replace
        sourceLabels:
          - __metrics_path__
        targetLabel: metrics_path
    probesRelabelings:
      - action: replace
        sourceLabels:
          - __metrics_path__
        targetLabel: metrics_path
    metricRelabelings:
      - action: drop
        sourceLabels:
          - __name__
          - le
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
    relabelings:
      - action: replace
        sourceLabels:
          - __metrics_path__
        targetLabel: metrics_path
kubeControllerManager:
  enabled: true
  service:
    enabled: true
    ipDualStack: {}
  serviceMonitor:
    enabled: true
    port: http-metrics
    jobLabel: jobLabel
coreDns:
  enabled: true
  service:
    enabled: true
    port: 9153
    targetPort: 9153
    ipDualStack: {}
  serviceMonitor:
    enabled: true
    port: http-metrics
    jobLabel: jobLabel
kubeDns: {}
kubeEtcd:
  enabled: true
  service:
    enabled: true
    port: 2381
    targetPort: 2381
    ipDualStack: {}
  serviceMonitor:
    enabled: true
    port: http-metrics
    jobLabel: jobLabel
kubeScheduler:
  enabled: true
  service:
    enabled: true
    ipDualStack: {}
  serviceMonitor:
    enabled: true
    port: http-metrics
    jobLabel: jobLabel
kubeProxy:
  enabled: true
  service:
    enabled: true
    port: 10249
    targetPort: 10249
    ipDualStack: {}
  serviceMonitor:
    enabled: true
    port: http-metrics
    jobLabel: jobLabel
kubeStateMetrics: {}
kube-state-metrics:
  releaseLabel: true
  prometheusScrape: false
  prometheus:
    monitor:
      enabled: true
      honorLabels: true
nodeExporter:
  enabled: true
  operatingSystems:
    linux:
      enabled: true
    aix:
      enabled: true
    darwin:
      enabled: true
prometheus-node-exporter:
  podLabels:
    jobLabel: node-exporter
  releaseLabel: true
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
  service:
    portName: http-metrics
    labels:
      jobLabel: node-exporter
  prometheus:
    monitor:
      enabled: true
      jobLabel: jobLabel
      scrapeTimeout: ''
prometheusOperator:
  enabled: true
  revisionHistoryLimit: 10
  tls:
    enabled: true
    tlsMinVersion: VersionTLS13
    internalPort: 10250
  livenessProbe:
    enabled: true
    failureThreshold: 3
    initialDelaySeconds: 0
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  readinessProbe:
    enabled: true
    failureThreshold: 3
    initialDelaySeconds: 0
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  admissionWebhooks:
    timeoutSeconds: 10
    enabled: true
    mutatingWebhookConfiguration: {}
    validatingWebhookConfiguration: {}
    deployment:
      podDisruptionBudget: {}
    patch:
      enabled: false
      image:
        registry: registry.k8s.io
        repository: ingress-nginx/kube-webhook-certgen
        tag: v1.5.3
        pullPolicy: IfNotPresent
      resources: {}
      ttlSecondsAfterFinished: 60
      securityContext:
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      serviceAccount:
        create: true
        automountServiceAccountToken: true
    createSecretJob:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
    patchWebhookJob:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
    certManager: {}
  networkPolicy: {}
  serviceAccount:
    create: true
    automountServiceAccountToken: true
  terminationGracePeriodSeconds: 30
  service:
    ipDualStack: {}
    type: ClusterIP
  podDisruptionBudget: {}
  kubeletService:
    enabled: true
    namespace: kube-system
  kubeletEndpointsEnabled: true
  kubeletEndpointSliceEnabled: false
  serviceMonitor:
    selfMonitor: true
  resources: {}
  env:
    GOGC: '30'
  securityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  image:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    pullPolicy: IfNotPresent
  prometheusConfigReloader:
    image:
      registry: quay.io
      repository: prometheus-operator/prometheus-config-reloader
  thanosImage:
    registry: quay.io
    repository: thanos/thanos
    tag: v0.38.0
  secretFieldSelector: type!=kubernetes.io/dockercfg,type!=kubernetes.io/service-account-token,type!=helm.sh/release.v1
  automountServiceAccountToken: true
prometheus:
  enabled: true
  networkPolicy: {}
  serviceAccount:
    create: true
    automountServiceAccountToken: true
  thanosService: {}
  thanosServiceExternal: {}
  service:
    enabled: true
    ipDualStack: {}
    port: 9090
    targetPort: 9090
    reloaderWebPort: 8080
    type: ClusterIP
    publishNotReadyAddresses: false
    sessionAffinity: None
  servicePerReplica: {}
  podDisruptionBudget: {}
  thanosIngress: {}
  extraSecret: {}
  ingress: {}
  serviceMonitor:
    selfMonitor: true
  prometheusSpec:
    automountServiceAccountToken: true
    listenLocal: false
    enableAdminAPI: false
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.4.1
    ruleSelectorNilUsesHelmValues: true
    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true
    probeSelectorNilUsesHelmValues: true
    scrapeConfigSelectorNilUsesHelmValues: true
    scrapeConfigNamespaceSelector: {}
    retention: 10d
    tsdb:
      outOfOrderTimeWindow: 0s
    paused: false
    replicas: 1
    shards: 1
    logLevel: info
    logFormat: logfmt
    routePrefix: /
    podAntiAffinity: soft
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    additionalScrapeConfigsSecret: {}
    securityContext:
      runAsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault
    portName: http-web
    hostNetwork: false
thanosRuler:
  extraSecret: {}
